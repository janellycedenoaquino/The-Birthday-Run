<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · TBR map style and pins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="retailers-detail.js"></script>
<style>
/* Throwaway prototype: the real OpenFreeMap map (D11) with style and pin options, in the locked look. Prototype loads MapLibre from unpkg; the app bundles maplibre-gl 6.19. Sample stops are made up. */
:root{--bg:#FFFCF7;--ink:#1F2A5C;--muted:#4C557D;--hl:#FF9EC4;--btn:#8EC5FF;--hover:#8FE3B0;--line:color-mix(in srgb,var(--ink) 16%,transparent)}
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(50% 50% at 5% 0%,#FFD6E5,transparent 70%),radial-gradient(50% 50% at 100% 0%,#D6EBFF,transparent 70%),radial-gradient(60% 60% at 50% 110%,#D3F5E1,transparent 70%)}
main{max-width:1180px;margin:0 auto;padding:20px 24px 150px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
.hl{background:var(--hl);padding:0 .14em;border-radius:6px;display:inline-block;transform:rotate(-2deg)}
.sub{color:var(--muted);margin-top:6px}
.wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}
#map{height:480px;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1.5px var(--ink)}
.stops{display:grid;gap:8px;align-content:start}
.loc{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:4px}.loc b{background:#fff;padding:6px 10px;border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--line)}
.st{display:grid;grid-template-columns:34px 54px 1fr;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.st:hover{box-shadow:0 0 0 3px var(--hover)}
.st .n{width:30px;height:30px;border-radius:50%;background:var(--hl);display:grid;place-items:center;font-weight:800;box-shadow:0 0 0 1.5px var(--ink)}
.st img{max-width:52px;max-height:30px;object-fit:contain}
.st b{display:block}.st span{font-size:12.5px;color:var(--muted)}
.gm{display:inline-flex;justify-content:center;margin-top:6px;font-family:inherit;font-weight:800;font-size:15px;padding:12px 16px;border-radius:12px;background:var(--btn);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);text-decoration:none}
/* pins */
.pin{cursor:pointer;transition:transform .15s}
.pin:hover{transform:scale(1.12)}
.p-num{width:34px;height:34px;border-radius:50%;background:var(--hl);display:grid;place-items:center;font:800 15px "Plus Jakarta Sans",sans-serif;color:var(--ink);box-shadow:0 0 0 2px var(--ink),0 4px 10px rgba(0,0,0,.25)}
.p-logo{position:relative;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--hl),0 0 0 4px var(--ink),0 6px 14px rgba(0,0,0,.25)}
.p-logo img{max-width:36px;max-height:26px;object-fit:contain}
.p-logo i{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--hl);font:800 12px "Plus Jakarta Sans",sans-serif;font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--ink)}
.p-drop{position:relative;width:36px;height:46px}
.p-drop svg{width:36px;height:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.p-drop b{position:absolute;top:7px;left:0;right:0;text-align:center;font:800 14px "Plus Jakarta Sans",sans-serif;color:var(--ink)}
.p-start{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 12px "Plus Jakarta Sans",sans-serif;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.3)}
.maplibregl-popup-content{font-family:"Plus Jakarta Sans",sans-serif;border-radius:12px;box-shadow:0 0 0 1.5px var(--ink),0 10px 24px -10px rgba(0,0,0,.3);padding:10px 12px}
.maplibregl-popup-content b{display:block}
/* panel */
.panel{position:fixed;left:16px;bottom:16px;z-index:50;background:#111;color:#ddd;border-radius:16px;padding:12px 14px;font:500 12px/1.2 system-ui,sans-serif;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px);width:600px}
.panel.min .rws{display:none}
.panel .tp{display:flex;justify-content:space-between;align-items:center}.panel .tp b{color:#fff;font-size:13px}
.panel button{font:inherit;background:#222;color:#ddd;border:0;border-radius:8px;padding:6px 9px;cursor:pointer}
.panel button.on{background:#fff;color:#111;font-weight:700}
.prow{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin-top:8px}.prow>span{color:#999}.prow div{display:flex;flex-wrap:wrap;gap:4px}
.now{margin-top:10px;color:#aaa;line-height:1.5}.now b{color:#fff}
@media (max-width:760px){.wrap{grid-template-columns:1fr}#map{height:340px}h1{font-size:28px}}
</style>
</head>
<body>
<main>
  <h1>Saturday food <span class="hl">run</span></h1>
  <p class="sub">Pickup: Sat, Dec 12 at 11:00 am · sample stops in Manhattan (made up)</p>
  <div class="wrap">
    <div id="map" role="img" aria-label="Map of 4 stops. The same stops are listed beside it."></div>
    <div class="stops" id="stops"></div>
  </div>
</main>
<div class="panel" id="panel">
  <div class="tp"><b>Map options (prototype only)</b><button id="min">Hide</button></div>
  <div class="rws">
    <div class="prow"><span>1 Map style</span><div data-k="ms"><button data-v="pastel">Pastel tint</button><button data-v="positron">Light grey</button><button data-v="liberty">Full colour</button><button data-v="cocoa">Cocoa (dark mode)</button></div></div>
    <div class="prow"><span>2 Pins</span><div data-k="pn"><button data-v="num">Pink numbers</button><button data-v="logo">Logo + number</button><button data-v="drop">Pastel drops</button></div></div>
    <div class="prow"><span>3 Route line</span><div data-k="rl"><button data-v="dots">Navy dots</button><button data-v="pink">Pink line</button><button data-v="none">No line</button></div></div>
    <div class="now" id="now"></div>
  </div>
</div>
<script>
const LOGO_DIR="../../../public/retailers/";
const R=id=>window.RETAILERS.find(r=>r.id===id);
const START=[-73.9845,40.7484];
const STOPS=[["panera-bread",[-73.9897,40.7411],"Panera, 5th Ave & 20th St"],["olive-garden",[-73.9862,40.7577],"Olive Garden, Times Square"],["cheesecake-factory",[-73.9787,40.7614],"Cheesecake Factory, 50th St"],["red-lobster",[-73.9855,40.7590],"Red Lobster, 41st St"]];
const W={ms:{pastel:"pastel tint",positron:"light grey",liberty:"full colour",cocoa:"cocoa (dark mode)"},pn:{num:"pink numbers",logo:"logo + number",drop:"pastel drops"},rl:{dots:"navy dots",pink:"pink line",none:"no line"}};
const st={ms:"pastel",pn:"num",rl:"dots"};
new URLSearchParams(location.search).forEach((v,k)=>{if(W[k]&&W[k][v])st[k]=v});
document.getElementById("stops").innerHTML=`<div class="loc">Starting from <b>ZIP 10001</b></div>`+STOPS.map(([id,,addr],i)=>`<div class="st" data-i="${i}"><span class="n">${i+1}</span><img src="${LOGO_DIR+R(id).l}" alt=""><div><b>${R(id).n}</b><span>${addr} · ${(0.6+i*.5).toFixed(1)} mi from the previous stop</span></div></div>`).join("")+`<a class="gm" href="#">Open in Google Maps ↗</a>`;
const url=s=>`https://tiles.openfreemap.org/styles/${s==="pastel"?"positron":s==="cocoa"?"positron":s}`;
const map=new maplibregl.Map({container:"map",style:url(st.ms),center:[-73.984,40.752],zoom:13.2,attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
function tint(){const set=(id,p,v)=>{if(map.getLayer(id))try{map.setPaintProperty(id,p,v)}catch(e){}};
  const L=map.getStyle().layers;
  if(st.ms==="pastel"){set("background","background-color","#FFFCF7");set("water","fill-color","#D6EBFF");set("park","fill-color","#D3F5E1");set("landcover_wood","fill-color","#E3F6EA");set("landuse_residential","fill-color","#FFF6F0");set("building","fill-color","#FBEFF3");
    L.filter(l=>l.type==="line"&&/highway|road/.test(l.id)&&!/casing/.test(l.id)).forEach(l=>set(l.id,"line-color","#FFFFFF"));
    L.filter(l=>l.type==="line"&&/casing/.test(l.id)).forEach(l=>set(l.id,"line-color","#F2D9E4"));
    L.filter(l=>l.type==="symbol").forEach(l=>{set(l.id,"text-color","#4C557D");set(l.id,"text-halo-color","#FFFCF7")})}
  if(st.ms==="cocoa"){set("background","background-color","#231A18");set("water","fill-color","#2B3446");set("park","fill-color","#243228");set("landcover_wood","fill-color","#243228");set("landuse_residential","fill-color","#2A201E");set("building","fill-color","#33272A");
    L.filter(l=>l.type==="line"&&/highway|road/.test(l.id)).forEach(l=>set(l.id,"line-color","#4A3A3A"));
    L.filter(l=>l.type==="symbol").forEach(l=>{set(l.id,"text-color","#E8D9D2");set(l.id,"text-halo-color","#231A18")})}}
let markers=[];
function pins(){markers.forEach(m=>m.remove());markers=[];
  const s=document.createElement("div");s.className="p-start";s.textContent="S";s.title="Start";markers.push(new maplibregl.Marker({element:s}).setLngLat(START).addTo(map));
  STOPS.forEach(([id,ll,addr],i)=>{const r=R(id);const el=document.createElement("div");el.className="pin";
    if(st.pn==="num")el.innerHTML=`<div class="p-num">${i+1}</div>`;
    if(st.pn==="logo")el.innerHTML=`<div class="p-logo"><img src="${LOGO_DIR+r.l}" alt=""><i>${i+1}</i></div>`;
    if(st.pn==="drop"){const c=["#FF9EC4","#8EC5FF","#8FE3B0","#E6DEFF"][i%4];el.innerHTML=`<div class="p-drop"><svg viewBox="0 0 36 46"><path d="M18 45C18 45 2 27 2 17a16 16 0 0 1 32 0c0 10-16 28-16 28z" fill="${c}" stroke="#1F2A5C" stroke-width="2"/></svg><b>${i+1}</b></div>`}
    markers.push(new maplibregl.Marker({element:el,anchor:st.pn==="drop"?"bottom":"center"}).setLngLat(ll).setPopup(new maplibregl.Popup({offset:22}).setHTML(`<b>${i+1}. ${r.n}</b>${addr}<br>${r.r}`)).addTo(map))})}
function line(){if(map.getLayer("rt"))map.removeLayer("rt");if(map.getSource("rt"))map.removeSource("rt");if(st.rl==="none")return;
  map.addSource("rt",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:[START,...STOPS.map(s=>s[1])]}}});
  map.addLayer({id:"rt",type:"line",source:"rt",paint:st.rl==="dots"?{"line-color":st.ms==="cocoa"?"#FFFCF7":"#1F2A5C","line-width":3,"line-dasharray":[1.2,1.6]}:{"line-color":"#FF9EC4","line-width":5,"line-opacity":.9},layout:{"line-cap":"round","line-join":"round"}})}
function apply(changed){
  document.querySelectorAll(".panel [data-k]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===st[g.dataset.k])));
  document.getElementById("now").innerHTML=`Showing: <b>${W.ms[st.ms]}</b> · ${W.pn[st.pn]} · ${W.rl[st.rl]}. Click a pin or a stop.`;
  history.replaceState(null,"","?"+new URLSearchParams(st));
  if(changed==="ms"){map.setStyle(url(st.ms));map.once("styledata",()=>{map.once("idle",()=>{tint();line()})});}else{tint();line()}
  pins()}
document.querySelectorAll(".panel [data-k]").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;st[g.dataset.k]=b.dataset.v;apply(g.dataset.k)});
document.querySelectorAll(".st").forEach(d=>d.onclick=()=>{const i=+d.dataset.i;map.flyTo({center:STOPS[i][1],zoom:15});markers[i+1].togglePopup()});
document.getElementById("min").onclick=e=>{const p=document.getElementById("panel");p.classList.toggle("min");e.target.textContent=p.classList.contains("min")?"Show":"Hide"};
map.on("load",()=>{tint();line();pins();apply()});
</script>
</body>
</html>
