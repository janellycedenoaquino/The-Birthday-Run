<body><h1>Phone menu: today the Discover / My Rewards / Plan / History links disappear on phones. These are the ways to bring them back.</h1><p class="s">Each phone is live: tap the tabs, the ☰ button or J. On a laptop the links stay in the top bar.</p><div class="row"><figure><figcaption><b>A. Bottom tab bar</b><span>Four tabs always at the bottom, like Instagram. The current page gets the pink block. Account (J) stays top right.</span><a href="16-phone-menu-screen.html?nav=a" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="16-phone-menu-screen.html?nav=a" width="390" height="844" title="A. Bottom tab bar"></iframe></div></figure><figure><figcaption><b>B. Menu button</b><span>A ☰ button top right opens a full-screen menu with big links. Shown open.</span><a href="16-phone-menu-screen.html?nav=b&demo=sheet" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="16-phone-menu-screen.html?nav=b&demo=sheet" width="390" height="844" title="B. Menu button"></iframe></div></figure><figure><figcaption><b>C. Floating dock</b><span>A navy rounded bar floating above the bottom edge; the current page turns pink.</span><a href="16-phone-menu-screen.html?nav=c" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="16-phone-menu-screen.html?nav=c" width="390" height="844" title="C. Floating dock"></iframe></div></figure><figure><figcaption><b>D. Tabs under the name</b><span>Scrollable tabs under the top bar, like the category chips. Scrolls away with the page.</span><a href="16-phone-menu-screen.html?nav=d" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="16-phone-menu-screen.html?nav=d" width="390" height="844" title="D. Tabs under the name"></iframe></div></figure><figure><figcaption><b>Account menu (all options)</b><span>Tapping J opens Settings, Birthday & reminders, Premium and Sign out.</span><a href="16-phone-menu-screen.html?nav=a&demo=acct" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="16-phone-menu-screen.html?nav=a&demo=acct" width="390" height="844" title="Account menu (all options)"></iframe></div></figure></div></body></html>
