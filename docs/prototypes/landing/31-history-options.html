<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · TBR History options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="retailers-detail.js"></script>
<style>
/* Throwaway prototype: History (S-107) in the locked look (decision 0016). */
:root{--bg:#FFFCF7;--ink:#1F2A5C;--muted:#4C557D;--hl:#FF9EC4;--btn:#8EC5FF;--hover:#8FE3B0;--line:color-mix(in srgb,var(--ink) 16%,transparent)}
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;width:70vw;height:70vw;border-radius:50%;filter:blur(40px)}
.blob.p{background:radial-gradient(circle,#FFD6E5 0%,transparent 65%);left:-25vw;top:-30vw}.blob.b{background:radial-gradient(circle,#D6EBFF 0%,transparent 65%);right:-25vw;top:-25vw}.blob.g{background:radial-gradient(circle,#D3F5E1 0%,transparent 65%);left:15vw;bottom:-45vw}
.hl{background:var(--hl);padding:0 .14em;border-radius:6px;display:inline-block;transform:rotate(-2deg)}
.btn{font-family:inherit;font-weight:800;font-size:15px;line-height:1;padding:12px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--btn);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{box-shadow:3px 3px 0 var(--ink),0 0 0 1.5px var(--ink)}.btn.ghost{background:#fff}
.top{display:flex;align-items:center;gap:14px;padding:16px 24px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;background:rgba(255,252,247,.7);padding:8px 12px;border-radius:12px}
.top nav{display:flex;gap:4px;margin-left:8px}.top nav a{font-weight:700;font-size:15px;text-decoration:none;padding:9px 12px;border-radius:10px;color:var(--ink)}
.top nav a[aria-current]{background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.me{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#FFD6E5;display:grid;place-items:center;font-weight:800;box-shadow:0 0 0 1.5px var(--ink)}
.tabbar{display:none}
main{max-width:1000px;margin:0 auto;padding:8px 24px 160px}
.head h1{font-size:42px;font-weight:800;letter-spacing:-.035em}
.head p{color:var(--muted);margin-top:8px}
.yrs{display:none;gap:6px;margin-top:18px;flex-wrap:wrap}
body.yr-tabs .yrs{display:flex}
.yrs button{font-family:inherit;font-weight:800;font-size:14px;padding:9px 14px;border-radius:10px;border:0;background:#fff;color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
.yrs button.on{background:var(--hl);box-shadow:inset 0 0 0 1.5px var(--ink),2px 2px 0 var(--ink)}
.cyc{margin-top:26px}
.cyc h2{font-size:24px;font-weight:800;letter-spacing:-.02em;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.cyc h2 small{font-size:14px;color:var(--muted);font-weight:700}
.sum{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.sum span{font-size:13px;font-weight:700;padding:6px 10px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.sum span:nth-child(1){background:#FFE8F0}.sum span:nth-child(2){background:#EAF4FF}.sum span:nth-child(3){background:#EFFAF2}
.empty{color:var(--muted);margin-top:10px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.5px var(--line)}
/* list style */
.items{display:grid;gap:10px;margin-top:12px}
.e{position:relative;display:grid;grid-template-columns:84px 70px 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.9);border-radius:16px;padding:10px 14px;box-shadow:0 0 0 1.5px var(--line)}
.e .dt{font-weight:800;font-size:14px;text-align:center;line-height:1.1}.e .dt small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.e .lg{height:40px;display:grid;place-items:center}.e img{max-width:64px;max-height:38px;object-fit:contain}
.e .nm{font-weight:800}.e .rw{font-size:13px;color:var(--muted)}
.e .nt{font-size:13px;margin-top:4px}.e .nt i{font-style:normal;background:#FFF5D6;padding:2px 6px;border-radius:6px}
.e .wh{font-size:12.5px;color:var(--muted);margin-top:2px}
.dots{width:36px;height:36px;border-radius:10px;border:0;background:#fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;font-size:18px;font-weight:800;color:var(--ink)}
.mm{position:absolute;right:12px;top:52px;z-index:20;background:#fff;border-radius:14px;padding:6px;box-shadow:0 0 0 1.5px var(--ink),0 16px 30px -12px rgba(0,0,0,.3);min-width:170px}
.mm button{display:block;width:100%;text-align:left;font-family:inherit;font-weight:700;font-size:14px;padding:10px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--ink)}
.mm button:hover{background:#FFD6E5}.mm .del{color:#B02A2A}
/* timeline style */
body.st-timeline .items{position:relative;padding-left:30px;gap:14px}
body.st-timeline .items:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;border-left:3px dotted var(--hl)}
body.st-timeline .e:before{content:"";position:absolute;left:-26px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--hl);box-shadow:0 0 0 2px var(--ink);transform:translateY(-50%)}
/* sticker book */
body.st-stickers .items{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
body.st-stickers .e{grid-template-columns:1fr;text-align:center;padding:16px 14px 14px;border-radius:22px;transform:rotate(var(--r));box-shadow:0 0 0 2px var(--ink),4px 4px 0 var(--ink);background:var(--cc)}
body.st-stickers .e .dt{order:3;margin-top:4px}
body.st-stickers .e .lg{height:56px;background:#fff;border-radius:14px;margin:0 auto;width:110px;box-shadow:0 0 0 1.5px var(--ink)}
body.st-stickers .e .dots{position:absolute;top:8px;right:8px;width:30px;height:30px}
body.st-stickers .e .tx{order:2}
body.st-stickers .stamp{display:block}
.stamp{display:none;position:absolute;top:-10px;left:-8px;background:var(--hl);font-weight:800;font-size:11px;padding:3px 8px;border-radius:8px;transform:rotate(-10deg);box-shadow:0 0 0 1.5px var(--ink);letter-spacing:.06em;text-transform:uppercase}
/* dialogs */
.ov{position:fixed;inset:0;z-index:40;background:rgba(31,42,92,.28);display:grid;place-items:center;padding:16px}
.dlg{width:min(460px,100%);background:var(--bg);border-radius:24px;padding:24px;box-shadow:0 0 0 1.5px var(--ink),0 30px 80px -20px rgba(0,0,0,.35)}
.dlg h2{font-size:22px;font-weight:800}.dlg p.t{color:var(--muted);margin-top:6px;line-height:1.45}
.dlg label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.dlg input{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:0;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toastbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:45;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700}
.estate{margin-top:24px;border-radius:24px;padding:28px;text-align:center;background:rgba(255,252,247,.75);box-shadow:inset 0 0 0 2px var(--hl)}
.estate img{width:min(420px,100%);border-radius:18px;box-shadow:0 0 0 1.5px var(--ink);margin-bottom:14px}
.estate h3{font-size:24px;font-weight:800}.estate p{color:var(--muted);margin:8px auto 16px;max-width:460px}
/* panel */
.panel{position:fixed;left:16px;bottom:16px;z-index:50;background:#111;color:#ddd;border-radius:16px;padding:12px 14px;font:500 12px/1.2 system-ui,sans-serif;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px);width:560px}
.panel.min .rws{display:none}
.panel .tp{display:flex;justify-content:space-between;align-items:center}.panel .tp b{color:#fff;font-size:13px}
.panel button{font:inherit;background:#222;color:#ddd;border:0;border-radius:8px;padding:6px 9px;cursor:pointer}
.panel button.on{background:#fff;color:#111;font-weight:700}
.prow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-top:8px}.prow>span{color:#999}.prow div{display:flex;flex-wrap:wrap;gap:4px}
.now{margin-top:10px;color:#aaa;line-height:1.5}.now b{color:#fff}
.ptag{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;font:700 10px system-ui;letter-spacing:.15em;background:#111;color:#fff;padding:5px 8px;border-radius:6px}
@media (max-width:700px){
  .top nav{display:none}.ptag{top:auto;bottom:130px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,252,247,.94);backdrop-filter:blur(14px);border-top:1.5px solid var(--line);padding:8px 4px}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:10.5px;font-weight:700;color:var(--muted)}
  .tabbar i{width:42px;height:30px;border-radius:10px;display:grid;place-items:center}.tabbar svg{width:20px;height:20px}
  .tabbar a[aria-current]{color:var(--ink)}.tabbar a[aria-current] i{background:var(--hl);box-shadow:0 0 0 1.5px var(--ink)}
  main{padding:4px 14px 150px}.head h1{font-size:32px}
  .e{grid-template-columns:56px 1fr auto;gap:10px}.e .lg{display:none}
  body.st-stickers .items{grid-template-columns:1fr 1fr;gap:12px}body.st-stickers .e .lg{display:grid;width:90px}
  .panel{bottom:76px}}
</style>
</head>
<body>
<div class="ptag">PROTOTYPE · HISTORY</div>
<div class="glow" aria-hidden="true"><div class="blob p"></div><div class="blob b"></div><div class="blob g"></div></div>
<header class="top"><span class="logo">The Birthday Run</span><nav><a href="#">Discover</a><a href="#">My Rewards</a><a href="#">Plan</a><a href="#" aria-current="page">History</a></nav><div class="me">J</div></header>
<main id="main"></main>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="layer"></div>

<div class="panel" id="panel">
  <div class="tp"><b>History options (prototype only)</b><button id="min">Hide</button></div>
  <div class="rws">
    <div class="prow"><span>1 Look</span><div data-k="st"><button data-v="list">List rows</button><button data-v="timeline">Timeline</button><button data-v="stickers">Sticker book</button></div></div>
    <div class="prow"><span>2 Years</span><div data-k="yr"><button data-v="all">All years stacked</button><button data-v="tabs">Year tabs</button></div></div>
    <div class="prow"><span>3 Year summary</span><div data-k="sm"><button data-v="on">Count chips</button><button data-v="off">None</button></div></div>
    <div class="prow"><span>Sample</span><div data-k="sd"><button data-v="full">2 years of pickups</button><button data-v="empty">No pickups ever</button></div></div>
    <div class="now" id="now"></div>
  </div>
</div>

<script>
const LOGO_DIR="../../../public/retailers/";
const IMG="../../../public/brand/doll-head.png";
const ALL=window.RETAILERS;const R=id=>ALL.find(r=>r.id===id)||{n:id,l:"",r:""};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const W={st:{list:"list rows",timeline:"timeline",stickers:"sticker book"},yr:{all:"all years stacked",tabs:"year tabs"},sm:{on:"count chips",off:"no summary"},sd:{full:"2 years of pickups",empty:"no pickups ever"}};
const st={st:"list",yr:"all",sm:"on",sd:"full",year:2026};
new URLSearchParams(location.search).forEach((v,k)=>{if(W[k]&&W[k][v])st[k]=v});
const CC=["#FFE8F0","#EAF4FF","#EFFAF2","#F1ECFF"];
let data={2027:[],2026:[{id:"a",r:"sephora",d:"2026-12-07",note:"Got the mini perfume set",where:"Sephora, Union Square"},{id:"b",r:"starbucks",d:"2026-12-06",note:"Caramel macchiato",where:""},{id:"c",r:"panera-bread",d:"2026-12-09",note:"",where:"Panera on 86th"}],
  2025:[{id:"d",r:"olive-garden",d:"2025-12-10",note:"Tiramisu with the girls",where:""},{id:"e",r:"chipotle",d:"2025-12-08",note:"",where:""},{id:"f",r:"ulta-beauty",d:"2025-12-12",note:"",where:"Ulta, Atlantic Terminal"},{id:"g",r:"golden-corral",d:"2025-12-06",note:"Program ended in 2026",where:""}]};
const fmtD=s=>{const d=new Date(s+"T12:00");return{m:d.toLocaleDateString("en-US",{month:"short"}),d:d.getDate(),wd:d.toLocaleDateString("en-US",{weekday:"short"})}};
function entry(e,i){const r=R(e.r),f=fmtD(e.d);return `<article class="e" style="--r:${[-2,1.5,-1,2][i%4]}deg;--cc:${CC[i%4]}"><span class="stamp">Claimed</span><div class="dt"><small>${f.m}</small>${f.d}<small>${f.wd}</small></div><div class="lg">${r.l?`<img src="${LOGO_DIR+esc(r.l)}" alt="">`:`<b>${esc(r.n[0])}</b>`}</div>
  <div class="tx"><p class="nm">${esc(r.n==="golden-corral"?"Golden Corral":r.n)}</p><p class="rw">${esc(r.r||"Free birthday reward")}</p>${e.note?`<p class="nt"><i>${esc(e.note)}</i></p>`:""}${e.where?`<p class="wh">${esc(e.where)}</p>`:""}</div>
  <button class="dots" data-mm="${e.id}" aria-label="Menu for ${esc(r.n)} pickup" aria-haspopup="menu">⋯</button></article>`}
function cycle(y){const list=[...data[y]].sort((a,b)=>b.d.localeCompare(a.d));const cnt=list.length;
  const sum=st.sm==="on"&&cnt?`<div class="sum"><span>${cnt} picked up</span><span>${new Set(list.map(e=>R(e.r).c)).size} kinds of treats</span><span>First: ${fmtD(list[list.length-1].d).m} ${fmtD(list[list.length-1].d).d}</span></div>`:"";
  return `<section class="cyc"><h2>${y} Birthday Run ${y===2027?"<small>coming up</small>":`<small>${cnt} picked up</small>`}</h2>${sum}${cnt?`<div class="items">${list.map(entry).join("")}</div>`:`<p class="empty">Nothing picked up yet.</p>`}</section>`}
function render(){const M=document.getElementById("main");
  if(st.sd==="empty"){M.innerHTML=`<section class="head"><h1><span class="hl">History</span></h1></section><div class="estate"><img src="${IMG}" alt=""><h3>No pickups yet</h3><p>No pickups yet. When you mark a reward picked up, it shows here.</p><a class="btn" href="#">Go to My Rewards</a></div>`;return}
  const yrs=[2027,2026,2025];
  M.innerHTML=`<section class="head"><h1><span class="hl">History</span></h1><p>Everything you've picked up, one Birthday Run at a time.</p></section>
   <div class="yrs" role="tablist">${yrs.map(y=>`<button class="${st.year===y?"on":""}" data-y="${y}">${y}</button>`).join("")}</div>
   ${(st.yr==="tabs"?[st.year]:yrs).map(cycle).join("")}`;
  M.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{st.year=+b.dataset.y;render()});
  M.querySelectorAll("[data-mm]").forEach(b=>b.onclick=e=>{e.stopPropagation();closeMenus();const art=b.closest(".e");art.insertAdjacentHTML("beforeend",`<div class="mm" role="menu"><button role="menuitem" data-ed>Edit note and place</button><button role="menuitem" class="del" data-del>Delete</button></div>`);
    const id=b.dataset.mm,y=Object.keys(data).find(k=>data[k].some(x=>x.id===id)),it=data[y].find(x=>x.id===id);
    art.querySelector("[data-ed]").onclick=()=>edit(it);art.querySelector("[data-del]").onclick=()=>del(y,it)})}
function closeMenus(){document.querySelectorAll(".mm").forEach(m=>m.remove())}
addEventListener("click",closeMenus);
let lf=null;
function openDlg(h){lf=document.activeElement;document.getElementById("layer").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">${h}</div></div>`;document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")closeDlg()}}
function closeDlg(){document.getElementById("layer").innerHTML="";if(lf&&lf.isConnected)lf.focus()}
addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("ov"))closeDlg()});
function toast(t){const d=document.createElement("div");d.className="toastbar";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function edit(it){openDlg(`<h2 id="dt">Edit ${esc(R(it.r).n)} pickup</h2><label for="n">Note (optional)</label><input id="n" value="${esc(it.note)}" maxlength="200"><label for="w">Where (optional)</label><input id="w" value="${esc(it.where)}" maxlength="80"><div class="acts"><button class="btn ghost" id="c">Cancel</button><button class="btn" id="s">Save</button></div>`);
  document.getElementById("n").focus();document.getElementById("c").onclick=closeDlg;document.getElementById("s").onclick=()=>{it.note=document.getElementById("n").value;it.where=document.getElementById("w").value;closeDlg();render();toast("Pickup saved.")}}
function del(y,it){openDlg(`<h2 id="dt">Delete this pickup?</h2><p class="t">It's removed from your history. If the reward is still open, it shows in My Rewards again.</p><div class="acts"><button class="btn ghost" id="c">Cancel</button><button class="btn" style="background:#FFDCDC" id="s">Delete</button></div>`);
  document.getElementById("c").focus();document.getElementById("c").onclick=closeDlg;document.getElementById("s").onclick=()=>{data[y]=data[y].filter(x=>x!==it);closeDlg();render();toast("Pickup deleted.")}}
const ICN={d:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>',r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s4 1 6 1c2 0 6 2 6-1s-4-3-6 1"/></svg>',p:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>',h:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>'};
document.getElementById("tabbar").innerHTML=[["d","Discover"],["r","My Rewards"],["p","Plan"],["h","History",1]].map(([k,t,c])=>`<a href="#" ${c?'aria-current="page"':""}><i>${ICN[k]}</i>${t}</a>`).join("");
function apply(){document.body.className=`st-${st.st} yr-${st.yr}`;
  document.querySelectorAll(".panel [data-k]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===st[g.dataset.k])));
  document.getElementById("now").innerHTML=`Showing: <b>${W.st[st.st]}</b> · ${W.yr[st.yr]} · ${W.sm[st.sm]} · ${W.sd[st.sd]}. Open ⋯ to edit or delete.`;
  render();const q=new URLSearchParams();for(const k in W)q.set(k,st[k]);history.replaceState(null,"","?"+q)}
document.querySelectorAll(".panel [data-k]").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;st[g.dataset.k]=b.dataset.v;apply()});
document.getElementById("min").onclick=e=>{const p=document.getElementById("panel");p.classList.toggle("min");e.target.textContent=p.classList.contains("min")?"Show":"Hide"};
if(innerWidth<700){document.getElementById("panel").classList.add("min");document.getElementById("min").textContent="Show"}
apply();
</script>
</body>
</html>
