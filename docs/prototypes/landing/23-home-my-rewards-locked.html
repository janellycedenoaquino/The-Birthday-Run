<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · TBR home = My Rewards (ring, countdown, empty state)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="retailers-detail.js"></script>
<style>
/* Throwaway prototype: Dashboard (S-102) in the locked look (decision 0016). Sample: birthday Dec 6, 8 programs. */
:root{--bg:#FFFCF7;--ink:#1F2A5C;--muted:#4C557D;--hl:#FF9EC4;--btn:#8EC5FF;--hover:#8FE3B0;--line:color-mix(in srgb,var(--ink) 16%,transparent)}
*{box-sizing:border-box;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;width:70vw;height:70vw;border-radius:50%;filter:blur(40px)}
.blob.p{background:radial-gradient(circle,#FFD6E5 0%,transparent 65%);left:-25vw;top:-30vw}
.blob.b{background:radial-gradient(circle,#D6EBFF 0%,transparent 65%);right:-25vw;top:-25vw}
.blob.g{background:radial-gradient(circle,#D3F5E1 0%,transparent 65%);left:15vw;bottom:-45vw}
a{color:inherit}
.hl{background:var(--hl);padding:0 .14em;border-radius:6px;display:inline-block;transform:rotate(-2deg)}
.btn{font-family:inherit;font-weight:800;font-size:15px;line-height:1;padding:12px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--btn);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn:hover{box-shadow:3px 3px 0 var(--ink),0 0 0 1.5px var(--ink)}
.btn.sm{font-size:13px;padding:9px 12px}
.btn.ghost{background:#fff}

/* top bar (laptop) + tab bar (phone), locked */
.top{display:flex;align-items:center;gap:14px;padding:16px 24px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;background:rgba(255,252,247,.7);padding:8px 12px;border-radius:12px;text-decoration:none}
.top nav{display:flex;gap:4px;margin-left:8px}
.top nav a{font-weight:700;font-size:15px;text-decoration:none;padding:9px 12px;border-radius:10px}
.top nav a[aria-current]{background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.me{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#FFD6E5;display:grid;place-items:center;font-weight:800;box-shadow:0 0 0 1.5px var(--ink)}
.tabbar{display:none}
main{max-width:1100px;margin:0 auto;padding:8px 24px 140px}

/* hero */
.hero{display:flex;align-items:center;gap:26px;border-radius:28px;padding:30px 32px;background:rgba(255,252,247,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ink) 12%,transparent),0 20px 60px -30px rgba(0,0,0,.2)}
.hero .tx{flex:1}
.hero small{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.hero h1{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.08;margin-top:6px}
.hero p{color:var(--muted);margin-top:10px;font-size:17px;line-height:1.5}
.big{font-size:96px;font-weight:800;letter-spacing:-.05em;line-height:.9}
.doll{display:none;width:150px;height:150px;border-radius:50%;background:#FFD6E5;overflow:hidden;flex:none;box-shadow:0 0 0 1.5px var(--ink)}
.doll img{width:100%;height:100%;object-fit:cover;object-position:center 12%}
body.dl-on .doll{display:block}
.ringp{width:150px;height:150px;flex:none;position:relative}
.ringp svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringp b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;text-align:center;line-height:1}
.ringp b span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}

/* sections */
.sec{margin-top:26px}
.sec h2{font-size:24px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;justify-content:space-between}
.sec h2 a{font-size:14px;font-weight:700;text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:3px;text-underline-offset:3px}
.rows{display:grid;gap:10px;margin-top:12px}
.rw{display:grid;grid-template-columns:76px 1fr auto auto;gap:14px;align-items:center;background:rgba(255,255,255,.85);border-radius:16px;padding:10px 14px;box-shadow:0 0 0 1.5px var(--line)}
.rw .lg{height:44px;display:grid;place-items:center}
.rw img{max-width:70px;max-height:40px;object-fit:contain}
.rw .nm{font-size:13px;font-weight:700;color:var(--muted)}
.rw .gf{font-weight:800;font-size:16px;line-height:1.25}
.badge{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:6px 10px;border-radius:10px;white-space:nowrap}
.badge svg{width:15px;height:15px}
.b-urgent{background:#FFDCDC;box-shadow:inset 0 0 0 1.5px #D64545}
.b-soon{background:#FFE3D3;box-shadow:inset 0 0 0 1.5px #E07A3F}
.b-relax{background:#D3F5E1;box-shadow:inset 0 0 0 1.5px #2E9E6A}
.b-later{background:#EEF1FA;box-shadow:inset 0 0 0 1.5px var(--line)}
.badge i{font-style:normal;font-weight:600;color:var(--muted)}
/* checklist */
.chk{cursor:pointer}
.chk .tick{width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-weight:800;background:#fff}
.chk.on{background:rgba(211,245,225,.7)}
.chk.on .tick{background:var(--hover);box-shadow:inset 0 0 0 2px var(--ink)}
.chk.on .gf{text-decoration:line-through;text-decoration-color:var(--hl);text-decoration-thickness:3px}
.pbar{height:12px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--hl);transition:width .4s}
/* stats (spec) */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.stat{border-radius:18px;padding:18px 20px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1.5px var(--line)}
.stat b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em}
.stat span{color:var(--muted)}
/* link cards */
.links{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px}
.lk{border-radius:18px;padding:18px;background:var(--cc);box-shadow:0 0 0 1.5px var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s}
.lk:hover{box-shadow:3px 3px 0 var(--ink),0 0 0 1.5px var(--ink)}
.lk b{font-size:18px;font-weight:800}
.lk span{font-size:14px;color:var(--muted);line-height:1.4}
body.lk-none .sec.lks{display:none}
.namehint{margin-top:16px;font-size:14px}
.namehint a{font-weight:700;text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:3px;text-underline-offset:3px}
canvas#conf{position:fixed;inset:0;z-index:40;pointer-events:none}

/* panel */
.panel{position:fixed;left:16px;bottom:16px;z-index:50;background:#111;color:#ddd;border-radius:16px;padding:12px 14px;font:500 12px/1.2 system-ui,sans-serif;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px);width:560px}
.panel.min .rws{display:none}
.panel .tp{display:flex;justify-content:space-between;align-items:center}.panel .tp b{color:#fff;font-size:13px}
.panel button{font:inherit;background:#222;color:#ddd;border:0;border-radius:8px;padding:6px 9px;cursor:pointer}
.panel button.on{background:#fff;color:#111;font-weight:700}
.prow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-top:8px}.prow>span{color:#999}.prow div{display:flex;flex-wrap:wrap;gap:4px}
.now{margin-top:10px;color:#aaa;line-height:1.5}.now b{color:#fff}
.ptag{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;font:700 10px system-ui;letter-spacing:.15em;background:#111;color:#fff;padding:5px 8px;border-radius:6px}
@media (max-width:700px){
  .top nav{display:none}.ptag{top:auto;bottom:130px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,252,247,.94);backdrop-filter:blur(14px);border-top:1.5px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:10.5px;font-weight:700;color:var(--muted)}
  .tabbar i{width:42px;height:30px;border-radius:10px;display:grid;place-items:center}.tabbar svg{width:20px;height:20px}
  .tabbar a[aria-current]{color:var(--ink)}.tabbar a[aria-current] i{background:var(--hl);box-shadow:0 0 0 1.5px var(--ink)}
  main{padding:4px 14px 130px}.hero{flex-direction:column;align-items:flex-start;padding:22px 20px;gap:14px}.hero h1{font-size:32px}.big{font-size:72px}
  .doll,.ringp{width:96px;height:96px}.ringp b{font-size:20px}
  .rw{grid-template-columns:56px 1fr;gap:6px 10px}.rw .badge,.rw .act,.rw .tick{grid-column:2;justify-self:start}.rw.chk{grid-template-columns:56px 1fr auto}.rw.chk .tick{grid-column:3;grid-row:1/3;align-self:center}.rw img{max-width:52px}body{overflow-x:hidden}
  .links{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.panel{bottom:76px}}
.panel{display:none}
.sub{color:var(--muted);margin-top:6px}
.empty{color:var(--muted);padding:12px 2px}
.seeall{display:inline-block;margin-top:14px;font-weight:800;text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:3px;text-underline-offset:4px}
.hero.small{padding:22px 26px}.hero.small h1{font-size:36px}

.panel{display:block!important}
.stats2{display:flex;gap:14px}
.st2{display:flex;align-items:center;gap:16px;border-radius:22px;padding:16px 20px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1.5px var(--line);flex:1}
.st2 .ringp{width:96px;height:96px}.st2 .ringp b{font-size:22px}
.st2 .bigN{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:.9}
.st2 p{font-weight:800;font-size:18px;line-height:1.25}.st2 p span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
.hero .stats2{flex:none}.hero .st2{background:none;box-shadow:none;padding:0 0 0 18px;border-left:1.5px solid var(--line);border-radius:0}
.sec.statsec{margin-top:18px}
.emptybox{margin-top:22px;border-radius:24px;padding:28px;background:rgba(255,252,247,.7);box-shadow:inset 0 0 0 2px var(--hl);text-align:center}
.emptybox h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.emptybox p{color:var(--muted);margin:8px auto 18px;max-width:520px;line-height:1.5}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;text-align:left}
.qk{position:relative;border-radius:16px;background:#fff;box-shadow:0 0 0 1.5px var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.qk .lg{height:46px;display:grid;place-items:center}.qk img{max-width:100px;max-height:40px;object-fit:contain}
.qk b{font-size:13px;color:var(--muted)}.qk span{font-weight:800;font-size:15px;line-height:1.25}
.qk button{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:10px;border:0;background:#fff;box-shadow:0 0 0 1.5px var(--ink);font-weight:800;font-size:18px;cursor:pointer;color:var(--ink)}
.qk.on{box-shadow:0 0 0 3px var(--hover)}.qk.on button{background:var(--hover)}
@media (max-width:700px){.stats2{flex-direction:column}.hero .stats2{flex-direction:row}.hero .st2{border-left:0;padding:0}.quick{grid-template-columns:1fr 1fr}.st2 .bigN{font-size:48px}}
</style>
</head>
<body class="dl-on lk-cards">
<div class="ptag" id="ptag">PROTOTYPE</div>
<div class="glow" aria-hidden="true"><div class="blob p"></div><div class="blob b"></div><div class="blob g"></div></div>
<header class="top"><a class="logo" href="#">The Birthday Run</a>
  <nav id="topnav"></nav><div class="me">J</div></header>
<main id="main"></main>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<canvas id="conf"></canvas>
<div class="panel" id="panel">
  <div class="tp"><b>Home = My Rewards (prototype only)</b><button id="min">Hide</button></div>
  <div class="rws">
    <div class="prow"><span>Ring + countdown</span><div data-k="pl"><button data-v="hero">Inside the welcome card</button><button data-v="under">Own row under it</button><button data-v="bottom">At the bottom</button><button data-v="none">Neither</button></div></div>
    <div class="prow"><span>Sample</span><div data-k="dy"><button data-v="during">During the run (Dec 9)</button><button data-v="before">Before the birthday (Nov 24)</button><button data-v="empty">No programs picked</button></div></div>
    <div class="now" id="now"></div>
  </div>
</div>



<script>
const LOGO_DIR="../../../public/retailers/";
const DOLL="../../../public/brand/doll-head.png";
const ALL=window.RETAILERS;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MINE=["starbucks","sephora","chipotle","panera-bread","olive-garden","alamo-drafthouse","cheesecake-factory","red-lobster"].map(id=>ALL.find(r=>r.id===id)).filter(Boolean);
const picked=new Set(["starbucks","sephora"]);
const BD=new Date(2026,11,6);const day=86400000;
const fmt=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
function win(r){const w=r.w;if(w[0]==="m")return[new Date(2026,11,1),new Date(2026,11,31)];if(w[0]==="ms")return[new Date(2026,11,1),add(new Date(2026,11,1),w[1]-1)];if(w[0]==="me")return[BD,new Date(2026,11,31)];return[add(BD,w[0]),add(BD,w[1])]}
const IC={alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>'};
function status(r,today){const[s,e]=win(r);const left=Math.round((e-today)/day)+1,until=Math.round((s-today)/day);
  if(until>0)return{open:false,sort:1000+until,html:`<span class="badge b-later">${IC.cal}Starts ${fmt(s)}</span>`};
  if(left<=0)return{open:false,gone:true,sort:9999,html:`<span class="badge b-later">Ended</span>`};
  const txt=left===1?"Last day":`${left} days left`;
  const [cls,ic,word]=left<4?["b-urgent",IC.alert,"Ends soon"]:left<=10?["b-soon",IC.clock,"Coming up"]:["b-relax",IC.check,"Plenty of time"];
  return{open:true,sort:left,html:`<span class="badge ${cls}">${ic}${txt} <i>· ${word}</i></span>`}}
const lgo=r=>`<img src="${LOGO_DIR+esc(r.l)}" alt="${esc(r.n)} logo">`;

const V="b";
const st={pl:"under",dy:"during"};
new URLSearchParams(location.search).forEach((v,k)=>{if(k==="pl"&&/^(hero|under|bottom|none)$/.test(v))st.pl=v;if(k==="dy"&&/^(during|before|empty)$/.test(v))st.dy=v});
const POP=["starbucks","sephora","panera-bread","chick-fil-a"].map(id=>ALL.find(r=>r.id===id)).filter(Boolean);const quick=new Set();
function render(){const today=st.dy==="during"?new Date(2026,11,9):new Date(2026,10,24);const M=document.getElementById("main");const empty=st.dy==="empty";
  const mine=empty?[]:MINE;const rows=mine.map(r=>({r,s:status(r,today)}));const n=empty?0:picked.size,tot=mine.length;
  const open=rows.filter(x=>x.s.open&&!picked.has(x.r.id)).sort((a,b)=>a.s.sort-b.s.sort);
  const later=rows.filter(x=>!x.s.open&&!x.s.gone&&!picked.has(x.r.id)).sort((a,b)=>a.s.sort-b.s.sort);
  const row=({r,s})=>`<div class="rw"><div class="lg">${lgo(r)}</div><div><p class="nm">${esc(r.n)}</p><p class="gf">${esc(r.r)}</p></div>${s.html}<div class="act">${s.open?`<button class="btn sm ghost" data-pick="${esc(r.id)}">Picked up</button>`:""}</div></div>`;
  const daysTo=Math.round((new Date(2026,11,6)-today)/day);
  const C=2*Math.PI*62,pct=tot?n/tot:0;
  const ring=tot?`<div class="st2"><div class="ringp"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="#FFE8F0" stroke-width="18"/><circle cx="75" cy="75" r="62" fill="none" stroke="#FF9EC4" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}"/></svg><b>${n}/${tot}</b></div><p>Picked up<span>${tot-n} still to get this run</span></p></div>`:"";
  const count=st.dy==="before"||empty?`<div class="st2"><span class="bigN">${daysTo}</span><p>days to your birthday<span>Dec 6</span></p></div>`:`<div class="st2"><span class="bigN">${open.length}</span><p>open now<span>${open.filter(x=>x.s.sort<4).length?`${open.filter(x=>x.s.sort<4).length} end in 3 days`:"None end in the next 3 days"}</span></p></div>`;
  const stats=st.pl==="none"?"":`<div class="stats2">${ring}${count}</div>`;
  const hero=`<section class="hero small"><div class="tx"><h1>Welcome, <span class="hl">Jay</span></h1><p>${n?`${n} picked up this Birthday Run · Last pickup: Dec 6`:empty?"Let's find your birthday rewards.":"No pickups yet this Birthday Run."}</p></div>${st.pl==="hero"?stats:""}</section>`;
  const under=st.pl==="under"?`<section class="sec statsec">${stats}</section>`:"";
  const bottom=st.pl==="bottom"?`<section class="sec"><h2>Your run so far</h2><div style="margin-top:12px">${stats}</div></section>`:"";
  let body;
  if(empty){body=`<section class="emptybox"><h2>No programs <span class="hl">yet</span></h2><p>Add the loyalty programs you're in, and we'll show each birthday reward here with how long it lasts.</p><a class="btn" href="#">Find my programs on Discover</a>
    <div class="quick">${POP.map(r=>`<div class="qk ${quick.has(r.id)?"on":""}"><div class="lg">${lgo(r)}</div><b>${esc(r.n)}</b><span>${esc(r.r)}</span><button data-q="${esc(r.id)}" aria-pressed="${quick.has(r.id)}" aria-label="Add ${esc(r.n)}">${quick.has(r.id)?"✓":"+"}</button></div>`).join("")}</div><p style="margin:14px 0 0;font-size:13px">Popular to start with. Tap + to add.</p></section>`}
  else body=`<section class="sec"><h2>Open now <span style="font-size:15px;color:var(--muted);font-weight:700">${open.length}</span></h2><div class="rows">${open.map(row).join("")||`<p class="empty">Nothing open yet. Your first reward opens ${later[0]?later[0].s.html.replace(/<[^>]+>/g,"").replace("Starts ",""):"soon"}.</p>`}</div></section>`+
    (later.length?`<section class="sec"><h2>Starting later <span style="font-size:15px;color:var(--muted);font-weight:700">${later.length}</span></h2><div class="rows">${later.map(row).join("")}</div></section>`:"")+
    `<p class="namehint">Picked-up rewards move to <a href="#">History</a>. <a href="#">Add more programs on Discover</a></p>`;
  M.innerHTML=hero+under+body+bottom;
  M.querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{picked.add(el.dataset.pick);render()});
  M.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>{const q=el.dataset.q;quick.has(q)?quick.delete(q):quick.add(q);render()})}
function apply(){document.querySelectorAll(".panel [data-k]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===st[g.dataset.k])));
  document.getElementById("now").innerHTML=`Showing: ring + countdown <b>${{hero:"inside the welcome card",under:"in their own row",bottom:"at the bottom",none:"hidden"}[st.pl]}</b> · sample: ${{during:"during the run",before:"before the birthday",empty:"no programs picked (Nov 24)"}[st.dy]}`;
  render();history.replaceState(null,"","?pl="+st.pl+"&dy="+st.dy)}
document.querySelectorAll(".panel [data-k]").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;st[g.dataset.k]=b.dataset.v;apply()});
document.getElementById("min").onclick=e=>{const p=document.getElementById("panel");p.classList.toggle("min");e.target.textContent=p.classList.contains("min")?"Show":"Hide"};
if(innerWidth<700){document.getElementById("panel").classList.add("min");document.getElementById("min").textContent="Show"}
function confetti(){const c=document.getElementById("conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;

  let t=0;(function f(){t++;x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});if(t<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
