<body><h1>Phone layouts for the game (iPhone size, shown at 80%). Each phone is live: tap and play inside it.</h1><div class="row"><figure><figcaption><b>A. Tap to play</b><span>Buttons stay on the first screen; a link under them opens the game in place.</span><a href="5-phone-layouts.html?pv=a" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="5-phone-layouts.html?pv=a&panel=0&m=glow&s=2" width="390" height="844" title="Tap to play"></iframe></div></figure><figure><figcaption><b>B. Buttons first</b><span>Headline, text, buttons, then the game right under them.</span><a href="5-phone-layouts.html?pv=b" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="5-phone-layouts.html?pv=b&panel=0&m=glow&s=2" width="390" height="844" title="Buttons first"></iframe></div></figure><figure><figcaption><b>C. Compact</b><span>Game stays between text and buttons; subtext dropped, game shorter.</span><a href="5-phone-layouts.html?pv=c" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="5-phone-layouts.html?pv=c&panel=0&m=glow&s=2" width="390" height="844" title="Compact"></iframe></div></figure><figure><figcaption><b>D. Pull-up tab</b><span>A pink tab at the bottom slides the game up over the page.</span><a href="5-phone-layouts.html?pv=d" target="_blank">open full size</a></figcaption><div class="ph"><iframe src="5-phone-layouts.html?pv=d&panel=0&m=glow&s=2" width="390" height="844" title="Pull-up tab"></iframe></div></figure></div></body></html>
