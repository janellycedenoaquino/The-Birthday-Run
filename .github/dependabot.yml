# Weekly dependency updates, minor and patch grouped (BUILD "Dependabot, hooks, vercel.json", FR-41).
# Other major versions still arrive one PR each, for a D1 decision.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Node major in .nvmrc; bump it together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react (bundled by eslint-config-next) crashes under ESLint 10; bump when it works.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
