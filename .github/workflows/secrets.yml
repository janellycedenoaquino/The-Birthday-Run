# Secret scan (BUILD "CI, deployment and migrations", D18, decision 0009). Separate from ci.yml so
# it runs on every push to any branch or tag, docs-only ones included: a key is leaked the moment
# it reaches GitHub, whether or not it's ever merged.
name: Secret scan

on:
  push:

concurrency:
  group: secrets-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The expected hash is pinned here, not read from the release, so a replaced release asset
      # fails. Dependabot can't update this: bump the version and the hash together by hand.
      - name: Install gitleaks 8.30.1 (pinned SHA-256)
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          rm gitleaks_8.30.1_linux_x64.tar.gz
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .
